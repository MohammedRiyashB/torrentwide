services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TORRENTWIDE_API_TOKEN: ${TORRENTWIDE_API_TOKEN:?Set TORRENTWIDE_API_TOKEN in backend/.env}
      QBITTORRENT_HOST: http://qbittorrent:8080
      QBITTORRENT_USER: ${QBITTORRENT_USER:-admin}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:?Set QBITTORRENT_PASSWORD in backend/.env}
      TORRENT_DOWNLOAD_PATH: /downloads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - torrent_downloads:/downloads
    depends_on:
      - qbittorrent

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Kolkata}
      WEBUI_PORT: "8080"
      WEBUI_USERNAME: ${QBITTORRENT_USER:-admin}
      WEBUI_PASSWORD: ${QBITTORRENT_PASSWORD:?Set QBITTORRENT_PASSWORD in backend/.env}
      TORRENTING_PORT: "6881"
    volumes:
      - qbittorrent_config:/config
      - torrent_downloads:/downloads
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    # Keep the Web UI private; the API reaches it over the internal Docker network.

volumes:
  qbittorrent_config:
  torrent_downloads:
